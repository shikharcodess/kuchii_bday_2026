<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Her World — A Special Walk for Kuchii</title>
    <meta name="description" content="A 3D walkable birthday experience for Shivani (Kuchii)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
      <!-- Top Bar / Header -->
      <header id="top-bar">
        <div class="logo">
          <span class="title">Her World</span>
          <span class="subtitle">For Kuchii &hearts; &middot; Sept 22</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button id="sound-toggle-btn" class="sound-pill" title="Toggle Sound & Music">
            <span id="sound-icon">🔊</span>
            <span id="sound-label">Music</span>
          </button>
          <div class="status-pill" id="surprise-counter-pill">
            <span class="pulse-dot"></span>
            <span id="surprise-counter-text">Surprises: 0 / 8 ✨</span>
          </div>
        </div>
      </header>

      <!-- Prompt Overlay for station interaction -->
      <div id="interaction-prompt" class="hidden">
        <div class="prompt-badge">
          <span class="key-icon">E</span>
          <span class="prompt-text">Look closer</span>
        </div>
      </div>

      <!-- Message / Surprise Modal Panel -->
      <div id="message-panel" class="hidden"></div>

      <!-- Controls Guidance / Footnote -->
      <footer id="bottom-bar">
        <div class="controls-hint">
          <span class="control-key">W</span>
          <span class="control-key">A</span>
          <span class="control-key">S</span>
          <span class="control-key">D</span>
          <span class="control-key">Shift</span>
          <span class="hint-label">to run &middot; click / E to discover surprises</span>
        </div>
        <div class="version-tag">Happy Birthday Kuchii! &hearts; 22 Sept</div>
      </footer>
    </div>

    <!-- Script Entry Point -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
